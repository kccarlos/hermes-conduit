# xcodegen project spec — Conduit (native SwiftUI)
# Generate with: xcodegen generate
# Then open Conduit.xcodeproj in Xcode

name: Conduit
options:
  bundleIdPrefix: io.github.kccarlos
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_BITCODE: NO
    # Neither value is committed: both come from the environment when the
    # project is generated (see docs/FORK.md). Empty means upstream's default.
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    CONDUIT_DEFAULT_RELAY_URL: "${CONDUIT_DEFAULT_RELAY_URL}"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.15"
    CURRENT_PROJECT_VERSION: "162"
packages:
  # GPT-Live voice runs over WebRTC; Apple ships no WebRTC stack. Prebuilt
  # Google WebRTC as a binary xcframework, pinned to an exact release.
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 153.0.0
targets:
  Conduit:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Conduit
        excludes:
          - "Resources/AlternateIcons/**"
      - path: Conduit/Resources/AlternateIcons
        buildPhase: resources
      # End-to-end encrypted notifications (#431), shared with the
      # Notification Service Extension. Also the Apple Watch app's link
      # format and relay wires (Shared/WatchVoice,
      # designs/apple-watch-voice-direct.md) and Gemini Live's protocol and
      # session (Shared/GeminiLive, designs/apple-watch-voice-direct.md),
      # shared with the Watch app.
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kccarlos.conduit
        PRODUCT_NAME: Conduit
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Conduit/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Conduit/Conduit.entitlements
        # The draft-stripping phase below deletes lprojs it can't declare
        # up front, which the user-script sandbox would refuse.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: WebRTC
      - target: ConduitWatch
      # Embedded as Conduit.app/PlugIns/ConduitNotificationService.appex.
      - target: ConduitNotificationService
      # The configured launcher widgets are embedded with the app.
      - target: ConduitWidgets
    postBuildScripts:
      # A draft language (Info.plist ConduitDraftLanguages) is compiled from
      # the String Catalogs like any other; drop its lproj so it never ships.
      - name: Strip draft localizations
        basedOnDependencyAnalysis: false
        script: |
          python3 "$SRCROOT/scripts/strip-draft-localizations.py" \
            --info-plist "$SRCROOT/$INFOPLIST_FILE" \
            --bundle "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" \
            --development-language "$DEVELOPMENT_LANGUAGE"
  # The Apple Watch app: voice calls to Hermes, Gemini Live on the Watch
  # itself or GPT-Live through the host's audio bridge
  # (designs/apple-watch-voice-direct.md, apple-watch-gpt-live.md).
  # Embedded in the iPhone app; signed automatically so Xcode registers
  # its App ID on the first archive.
  ConduitWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ConduitWatch
        # The widget extension's own code (ConduitWatchWidgets).
        excludes:
          - "Widgets/**"
      - path: Shared/WatchVoice
      # The iPhone's own Gemini Live code: the Watch runs the same session
      # (designs/apple-watch-voice-direct.md).
      - path: Shared/GeminiLive
      # The iPhone's Grok Live session, which a Watch call to Grok runs
      # through the host's audio bridge.
      - path: Shared/GrokLive
      # GPT-Live's events, which the Watch reads and answers through the
      # host's audio bridge (designs/apple-watch-gpt-live.md).
      - path: Conduit/Voice/GPTLive/GPTLiveProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kccarlos.conduit.watchkitapp
        PRODUCT_NAME: ConduitWatch
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ConduitWatch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        PROVISIONING_PROFILE_SPECIFIER: ""
        # Push Notifications, for the PushKit token calls from Hermes ring
        # on (designs/hermes-calls-watch.md). Automatic signing adds the
        # capability to the App ID. Production, as the iPhone's: the relay
        # sends only to production APNs.
        CODE_SIGN_ENTITLEMENTS: ConduitWatch/ConduitWatch.entitlements
    dependencies:
      # Embedded as ConduitWatch.app/PlugIns/ConduitWatchWidgets.appex.
      - target: ConduitWatchWidgets
  # The Watch's complication and its control for the Action button,
  # Control Center and the Smart Stack: both start a call
  # (ConduitWatch/TalkToHermesIntent.swift). watchOS 26, where Watch apps
  # first get controls. Signed automatically, as the Watch app.
  ConduitWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: ConduitWatch/Widgets
        excludes:
          - "Info.plist"
      # The control's intent runs in the app, so both build it.
      - path: ConduitWatch/TalkToHermesIntent.swift
      - path: ConduitWatch/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kccarlos.conduit.watchkitapp.widgets
        PRODUCT_NAME: ConduitWatchWidgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ConduitWatch/Widgets/Info.plist
        TARGETED_DEVICE_FAMILY: "4"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        PROVISIONING_PROFILE_SPECIFIER: ""
  ConduitNotificationService:
    # Decrypts end-to-end encrypted notifications before iOS shows them
    # (#431). APNs still targets io.github.kccarlos.conduit; this App ID has no Push
    # capability of its own.
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ConduitNotificationService
      - path: Shared
        # The Watch app's code, Gemini Live, Grok Live and location
        # sharing, which the extension never uses.
        excludes:
          - "WatchVoice/**"
          - "GeminiLive/**"
          - "GrokLive/**"
          - "Widgets/**"
          - "Location/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kccarlos.conduit.NotificationService
        PRODUCT_NAME: ConduitNotificationService
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ConduitNotificationService/Info.plist
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: ConduitNotificationService/ConduitNotificationService.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  ConduitWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ConduitWidgets
        excludes:
          - "Info.plist"
          - "ConduitWidgets.entitlements"
          - "Resources/**"
      - path: ConduitWidgets/Resources/Assets.xcassets
        buildPhase: resources
      - path: Shared/Widgets
      - path: Conduit/Localizable.xcstrings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kccarlos.conduit.widgets
        PRODUCT_NAME: ConduitWidgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ConduitWidgets/Info.plist
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: ConduitWidgets/ConduitWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Strip draft localizations
        basedOnDependencyAnalysis: false
        script: |
          python3 "$SRCROOT/scripts/strip-draft-localizations.py" \
            --info-plist "$SRCROOT/$INFOPLIST_FILE" \
            --bundle "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" \
            --development-language "$DEVELOPMENT_LANGUAGE"
  ConduitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ConduitTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Conduit
  ConduitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ConduitUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Conduit
