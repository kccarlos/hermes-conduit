# Build the app and upload it to TestFlight (this fork only).
#
# Runs on every push to main that changes more than docs and tests, on tags,
# and on demand (Actions > TestFlight > Run workflow). It never submits for
# review. See docs/FORK.md.
#
# Signing is manual (project.ci.yml): the shared Apple Distribution
# certificate and this app's App Store profiles, read from 1Password, so a
# runner never creates a development certificate. The only GitHub secret is
# OP_SERVICE_ACCOUNT_TOKEN in the `testflight` environment, which only main
# and v* tags can use, so pull requests (including from forks) never see it.
name: TestFlight

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "ConduitTests/**"
      - "ConduitUITests/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive and upload to TestFlight
    # A fork of this fork has no secrets and would only fail.
    if: github.repository == 'kccarlos/hermes-conduit'
    runs-on: ${{ vars.CI_MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 60
    environment: testflight
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        env:
          XCODE_APP: ${{ vars.CI_XCODE_APP || '/Applications/Xcode_27.0.app' }}
        run: |
          # Fall back to the image default so an image refresh doesn't fail the job.
          [[ -d "$XCODE_APP" ]] || { echo "::warning::$XCODE_APP not found; using /Applications/Xcode.app"; XCODE_APP=/Applications/Xcode.app; }
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      # Xcode 26+ ships the Metal compiler as a separate component, and the
      # app builds Metal shaders; hosted images may not include it.
      - name: Metal toolchain
        run: |
          xcrun -sdk iphoneos metal --version >/dev/null 2>&1 \
            || xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk iphoneos metal --version

      # 1Password, three attempts 30 s apart: its CLI fails intermittently on
      # macOS 27 runners (400 "structure of request was invalid" or 500), even
      # with a good token. Values are step outputs, so only the steps that name
      # them see them; a failed attempt leaves its outputs empty.
      - name: Secrets from 1Password (attempt 1)
        id: op1
        continue-on-error: true
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APP_STORE_CONNECT_API_KEY_ID: op://github/app-store-connect-api-key/key_id
          APP_STORE_CONNECT_ISSUER_ID: op://github/app-store-connect-api-key/issuer_id
          APP_STORE_CONNECT_API_KEY_P8_BASE64: op://github/app-store-connect-api-key/p8_base64
          APPLE_CERTIFICATE_P12_BASE64: op://github/apple-distribution/p12_base64
          APPLE_CERTIFICATE_PASSWORD: op://github/apple-distribution/password
          APPLE_PROVISIONING_PROFILES_BASE64: op://github/conduit-provisioning-profiles/profiles_base64
          DEVELOPMENT_TEAM: op://github/conduit/team_id
          CONDUIT_DEFAULT_RELAY_URL: op://github/conduit/relay_url
      - name: Wait before 1Password attempt 2
        if: steps.op1.outcome == 'failure'
        run: sleep 30
      - name: Secrets from 1Password (attempt 2)
        id: op2
        if: steps.op1.outcome == 'failure'
        continue-on-error: true
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APP_STORE_CONNECT_API_KEY_ID: op://github/app-store-connect-api-key/key_id
          APP_STORE_CONNECT_ISSUER_ID: op://github/app-store-connect-api-key/issuer_id
          APP_STORE_CONNECT_API_KEY_P8_BASE64: op://github/app-store-connect-api-key/p8_base64
          APPLE_CERTIFICATE_P12_BASE64: op://github/apple-distribution/p12_base64
          APPLE_CERTIFICATE_PASSWORD: op://github/apple-distribution/password
          APPLE_PROVISIONING_PROFILES_BASE64: op://github/conduit-provisioning-profiles/profiles_base64
          DEVELOPMENT_TEAM: op://github/conduit/team_id
          CONDUIT_DEFAULT_RELAY_URL: op://github/conduit/relay_url
      - name: Wait before 1Password attempt 3
        if: steps.op2.outcome == 'failure'
        run: sleep 30
      - name: Secrets from 1Password (attempt 3)
        id: op3
        if: steps.op2.outcome == 'failure'
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APP_STORE_CONNECT_API_KEY_ID: op://github/app-store-connect-api-key/key_id
          APP_STORE_CONNECT_ISSUER_ID: op://github/app-store-connect-api-key/issuer_id
          APP_STORE_CONNECT_API_KEY_P8_BASE64: op://github/app-store-connect-api-key/p8_base64
          APPLE_CERTIFICATE_P12_BASE64: op://github/apple-distribution/p12_base64
          APPLE_CERTIFICATE_PASSWORD: op://github/apple-distribution/password
          APPLE_PROVISIONING_PROFILES_BASE64: op://github/conduit-provisioning-profiles/profiles_base64
          DEVELOPMENT_TEAM: op://github/conduit/team_id
          CONDUIT_DEFAULT_RELAY_URL: op://github/conduit/relay_url

      # The team ID and relay URL are not committed (this repository is
      # public); they come from the 1Password item `conduit`.
      - name: Generate the Xcode project (manual signing)
        env:
          DEVELOPMENT_TEAM: ${{ steps.op1.outputs.DEVELOPMENT_TEAM || steps.op2.outputs.DEVELOPMENT_TEAM || steps.op3.outputs.DEVELOPMENT_TEAM }}
          CONDUIT_DEFAULT_RELAY_URL: ${{ steps.op1.outputs.CONDUIT_DEFAULT_RELAY_URL || steps.op2.outputs.CONDUIT_DEFAULT_RELAY_URL || steps.op3.outputs.CONDUIT_DEFAULT_RELAY_URL }}
        run: |
          [[ -n "$DEVELOPMENT_TEAM" ]] || { echo "::error::team_id is empty"; exit 1; }
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate --spec project.ci.yml
          echo "DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM" >> "$GITHUB_ENV"
          echo "CONDUIT_DEFAULT_RELAY_URL=$CONDUIT_DEFAULT_RELAY_URL" >> "$GITHUB_ENV"

      # Key and issuer IDs are identifiers, not secrets, but stay masked.
      - name: App Store Connect key IDs
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ steps.op1.outputs.APP_STORE_CONNECT_API_KEY_ID || steps.op2.outputs.APP_STORE_CONNECT_API_KEY_ID || steps.op3.outputs.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ steps.op1.outputs.APP_STORE_CONNECT_ISSUER_ID || steps.op2.outputs.APP_STORE_CONNECT_ISSUER_ID || steps.op3.outputs.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          echo "APP_STORE_CONNECT_API_KEY_ID=$APP_STORE_CONNECT_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APP_STORE_CONNECT_ISSUER_ID=$APP_STORE_CONNECT_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Install signing material
        env:
          APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ steps.op1.outputs.APP_STORE_CONNECT_API_KEY_P8_BASE64 || steps.op2.outputs.APP_STORE_CONNECT_API_KEY_P8_BASE64 || steps.op3.outputs.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          APPLE_CERTIFICATE_P12_BASE64: ${{ steps.op1.outputs.APPLE_CERTIFICATE_P12_BASE64 || steps.op2.outputs.APPLE_CERTIFICATE_P12_BASE64 || steps.op3.outputs.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ steps.op1.outputs.APPLE_CERTIFICATE_PASSWORD || steps.op2.outputs.APPLE_CERTIFICATE_PASSWORD || steps.op3.outputs.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILES_BASE64: ${{ steps.op1.outputs.APPLE_PROVISIONING_PROFILES_BASE64 || steps.op2.outputs.APPLE_PROVISIONING_PROFILES_BASE64 || steps.op3.outputs.APPLE_PROVISIONING_PROFILES_BASE64 }}
        run: scripts/fork-ci/import-signing.sh

      # Strictly increasing, which App Store Connect requires within a
      # version; UTC so a local upload (`date -u`) stays comparable.
      - name: Build number
        run: echo "BUILD=$(date -u +%y%m%d%H%M)" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project Conduit.xcodeproj -scheme Conduit \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Conduit.xcarchive \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CURRENT_PROJECT_VERSION="$BUILD" \
            | tee build/archive.log | tail -n 40

      # The value itself is not printed: this repository's logs are public.
      - name: Check the build carries the relay URL
        if: env.CONDUIT_DEFAULT_RELAY_URL != ''
        run: |
          app=$(find build/Conduit.xcarchive/Products/Applications -maxdepth 1 -name "*.app" | head -1)
          url=$(/usr/libexec/PlistBuddy -c 'Print :ConduitDefaultRelayURL' "$app/Info.plist")
          [[ "$url" == https://* ]] || { echo "::error::ConduitDefaultRelayURL is missing or not https in the built app"; exit 1; }
          echo "ConduitDefaultRelayURL is set."

      - name: Export and upload to TestFlight
        run: |
          set -o pipefail
          scripts/fork-ci/write-export-options.sh build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/Conduit.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            | tee build/export.log | tail -n 40

      - name: Summary
        if: success()
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleShortVersionString' build/Conduit.xcarchive/Info.plist)"
          echo "Uploaded Conduit $version ($BUILD) to TestFlight. It shows up there after Apple finishes processing, usually within a few minutes." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: build/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up signing material
        if: always()
        run: scripts/fork-ci/cleanup-signing.sh
